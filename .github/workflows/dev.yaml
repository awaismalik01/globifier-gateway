name: Vercel Dev Deployment

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "dev"
          secret-path: "/"

      - name: Resolve env vars in vercel.json
        run: envsubst '${GLOBIFIER_AUTH_BE_URL} ${GLOBIFIER_AUTH_FE_URL}' < vercel.json > vercel.resolved.json && mv vercel.resolved.json vercel.json

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel (Preview)
        run: vercel --confirm --token ${{ secrets.VERCEL_TOKEN }}
